services:
  postgres:
    image: postgres:17-alpine
    container_name: urlref-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urlref_secure_password_replace_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shortener} -d ${POSTGRES_DB:-shortener}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: urlref-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD:-urlref_secure_password_replace_in_prod}@postgres:5432/${POSTGRES_DB:-shortener}?connection_limit=10&pool_timeout=5
      DIRECT_URL: postgresql://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD:-urlref_secure_password_replace_in_prod}@postgres:5432/${POSTGRES_DB:-shortener}
      APP_BASE_URL: ${APP_BASE_URL:-https://apiref.softics.in}
      FRONTEND_URL: ${FRONTEND_URL:-https://urlref.softics.in}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.softics.in}
      SESSION_SECRET: ${SESSION_SECRET:-replace_with_a_32_character_long_secret_in_prod_12345}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: urlref-prod-web
    restart: always
    depends_on:
      - api
    networks:
      - internal-net

  caddy:
    image: caddy:2-alpine
    container_name: urlref-prod-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - internal-net

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:

networks:
  internal-net:
    driver: bridge
