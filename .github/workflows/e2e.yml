name: E2E Playwright Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://shortener:test_password@localhost:5432/shortener_test
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Build All Workspaces
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        env:
          DATABASE_URL: postgresql://shortener:test_password@localhost:5432/shortener_test
          SESSION_SECRET: test_session_secret_with_at_least_32_characters_long_12345
        run: npx playwright test
