services:
  # ---------------------------------------------------------------------------
  # 1. URLRef Express API Backend
  # ---------------------------------------------------------------------------
  - type: web
    name: urlref-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    domains:
      - apiref.softics.in
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: urlref-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: urlref-postgres
          property: connectionString
      - key: APP_BASE_URL
        value: https://apiref.softics.in
      - key: FRONTEND_URL
        value: https://urlref.softics.in
      - key: COOKIE_DOMAIN
        value: .softics.in
      - key: SESSION_SECRET
        generateValue: true
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # 2. URLRef React + Vite SPA Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: urlref-web
    runtime: static
    buildCommand: npm run build:web
    staticPublishPath: apps/web/dist
    region: oregon
    plan: free
    domains:
      - urlref.softics.in
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://apiref.softics.in

# ---------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ---------------------------------------------------------------------------
databases:
  - name: urlref-postgres
    databaseName: shortener
    user: shortener
    region: oregon
    plan: starter
    postgresMajorVersion: 17
