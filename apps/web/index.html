          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is a dynamic QR code?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A dynamic QR code encodes a short redirect link. If you print packaging or flyers and later need to change where the link points, you can edit the destination in your dashboard without reprinting."
                }
              },
              {
                "@type": "Question",
                "name": "How do custom domains work for marketing agencies?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Marketing agencies can connect up to 5 custom domains on our Growth plan. You point a CNAME DNS record to our edge target. Cloudflare for SaaS automatically issues an SSL certificate, and short links run under your clients' brand domains."
                }
              },
              {
                "@type": "Question",
                "name": "Which payment methods are accepted in India?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "We support UPI AutoPay through Google Pay, PhonePe, Paytm, and BHIM, as well as domestic debit and credit cards and NetBanking."
                }
              },
              {
                "@type": "Question",
                "name": "Can I export dynamic QR codes for commercial physical printing?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. URLRef generates lossless vector SVG files and high resolution 1024 pixel PNG files with embedded brand logos suitable for print packaging, restaurant tent cards, and marketing collateral."
                }
              },
              {
                "@type": "Question",
                "name": "Do visitors see any interstitial ads or slow redirects?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. URLRef executes instant HTTP 302 redirects with zero intermediate splash screens, zero ads, and sub 20ms response times powered by our edge database."
                }
